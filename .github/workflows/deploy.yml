name: deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/production/nginx/Dockerfile
          push: true
          provenance: false
          tags: ${{ secrets.APP_ECR_ACCOUNT_URL }}/${{ vars.PROJECT }}/${{ vars.ENV
            }}/nginx:${{ github.sha }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/production/php/app.Dockerfile
          push: true
          provenance: false
          tags: ${{ secrets.APP_ECR_ACCOUNT_URL }}/${{ vars.PROJECT }}/${{ vars.ENV
            }}/app:${{ github.sha }}

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/production/php/migration.Dockerfile
          push: true
          provenance: false
          tags: ${{ secrets.APP_ECR_ACCOUNT_URL }}/${{ vars.PROJECT }}/${{ vars.ENV
            }}/migration:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Load env and substitute task definitions
        shell: bash
        env:
          ENV_VARIABLES: ${{ toJSON(vars) }}
          SECRETS: ${{ toJSON(secrets) }}
          SHA1: ${{ github.sha }}
        run: |
          set -euo pipefail

          while IFS='=' read -r key value; do
            export "$key"="$value"
          done < <(echo "$SECRETS" | jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]')

          while IFS='=' read -r key value; do
            export "$key"="$value"
          done < <(echo "$ENV_VARIABLES" | jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]')

          required_vars=(
            APP_CPU
            APP_DOMAIN
            APP_ECR_ACCOUNT_URL
            APP_FRONT_DOMAIN
            APP_KEY_ARN
            APP_MEMORY
            DB_DATABASE
            DB_HOST
            DB_PASSWORD_ARN
            DB_USERNAME
            ECS_EXECUTION_ROLE_ARN
            ECS_TASK_ROLE_ARN
            ENV
            PROJECT
            SHA1
          )

          missing_vars=()
          for required_var in "${required_vars[@]}"; do
            if [ -z "${!required_var:-}" ]; then
              missing_vars+=("$required_var")
            fi
          done

          if [ "${#missing_vars[@]}" -gt 0 ]; then
            printf 'Missing required variables: %s\n' "${missing_vars[*]}" >&2
            exit 1
          fi

          envsubst < .github/task-definitions/app-task-definitions.json > /tmp/app-task-definitions.json
          envsubst < .github/task-definitions/migrate-task-definitions.json > /tmp/migrate-task-definitions.json

          if grep -R '\${' /tmp/app-task-definitions.json /tmp/migrate-task-definitions.json; then
            echo "Unresolved variables remain in task definitions." >&2
            exit 1
          fi

      - name: Run migration task
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: /tmp/migrate-task-definitions.json
          cluster: ${{ vars.ECS_CLUSTER }}
          run-task: true
          wait-for-task-stopped: true
          run-task-launch-type: FARGATE
          run-task-subnets: ${{ secrets.SUBNET_IDS }}
          run-task-security-groups: ${{ secrets.SECURITY_GROUP_IDS }}
          run-task-assign-public-IP: ENABLED

      - name: Deploy app task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: /tmp/app-task-definitions.json
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true